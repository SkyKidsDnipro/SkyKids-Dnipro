name: Перевірка сайту

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Спільні блоки зібрані (partials/ → сторінки)
        run: python3 tools/build.py --check
      - name: Посилання, файли та alt у картинок
        run: python3 tools/check_links.py
